<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Multi-competition football dashboard powered by open GitHub datasets." />
  <title>Football Intelligence</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">FI</div><div><b>Football Intelligence</b><span>European football command centre</span></div></div>
      <div class="nav-label">Workspace</div>
      <nav id="mainNav" class="nav">
        <button data-view="overview" class="active"><span>⌂</span><b>Overview</b></button>
        <button data-view="matches"><span>◷</span><b>Matches</b></button>
        <button data-view="competitions"><span>◫</span><b>Competitions</b></button>
        <button data-view="teams"><span>⬡</span><b>Teams</b></button>
        <button data-view="players"><span>◎</span><b>Players</b></button>
        <button data-view="statistics"><span>⌁</span><b>Statistics</b></button>
        <button data-view="compare"><span>⇄</span><b>Compare</b></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="source-mini"><span class="dot"></span><div><b>OpenFootball / GitHub</b><span>No API key or daily API quota</span></div></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div><div class="eyebrow">Unified football platform</div><h1 id="pageTitle">All Competitions</h1></div>
        <div class="controls">
          <select id="seasonSelect" aria-label="Season"></select>
          <select id="competitionSelect" aria-label="Competition"><option value="all">All Competitions</option></select>
          <button id="refreshBtn" class="ghost">↻ Refresh data</button>
        </div>
      </header>

      <div id="errorBanner" class="error-banner hidden"></div>
      <div id="loading" class="loading hidden"><span></span><b>Loading open football data from GitHub…</b></div>

      <section id="overviewView" class="view"></section>
      <section id="matchesView" class="view hidden"></section>
      <section id="competitionsView" class="view hidden"></section>
      <section id="teamsView" class="view hidden"></section>
      <section id="playersView" class="view hidden"></section>
      <section id="statisticsView" class="view hidden"></section>
      <section id="compareView" class="view hidden"></section>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
