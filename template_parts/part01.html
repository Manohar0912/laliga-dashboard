<title>LaLiga Analytics Dashboard</title>
<style>
:root{--bg:#07110d;--p:#0f1d17;--p2:#13251d;--line:#294036;--txt:#eef7f2;--muted:#94a99e;--g:#39e58c;--b:#67b7ff;--a:#ffc95c;--r:#ff7070}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#103124,transparent 30%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}h1{margin:0;font-size:26px}.sub,.muted{color:var(--muted)}.sub{font-size:12px;margin-top:4px}.mark{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--g);color:#042015;font-weight:950;margin-right:12px}.brand{display:flex;align-items:center}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,input{background:#0b1712;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 10px}.tag{padding:8px 10px;border:1px solid var(--line);border-radius:9px;color:var(--g);font-weight:800;font-size:11px}nav{position:sticky;top:6px;z-index:5;display:flex;gap:5px;background:#0b1712;border:1px solid var(--line);border-radius:13px;padding:6px;overflow:auto}nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer}nav button.active{background:var(--g);color:#04170d}.view{display:none;padding-top:16px}.view.active{display:block}.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.kpi b{font-size:27px;display:block;margin-top:5px}.kpi span{color:var(--muted);font-size:11px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.eyebrow{font-size:10px;color:var(--g);font-weight:900;letter-spacing:.13em}.title{font-size:19px;margin:3px 0 0}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #23372f;text-align:right;white-space:nowrap}th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#0b1712;position:sticky;top:0}th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){text-align:left}.team{font-weight:800}.form{display:flex;gap:4px}.f{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:900}.W{background:#173c2b;color:var(--g)}.D{background:#3a321a;color:var(--a)}.L{background:#3b2020;color:var(--r)}.matches{display:grid;gap:7px}.match{display:grid;grid-template-columns:105px 1fr 64px 1fr 100px;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0b1712}.home{text-align:right;font-weight:750}.away{font-weight:750}.score{text-align:center;font-weight:950;font-size:16px}.date,.meta{font-size:11px;color:var(--muted)}.meta{text-align:right}.metric{background:#0b1712;border:1px solid var(--line);border-radius:10px;padding:11px}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.split{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}.vs{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-weight:900}.big{font-size:34px;font-weight:950}.bar{display:grid;grid-template-columns:120px 1fr 55px;gap:8px;align-items:center;margin:9px 0}.track{height:8px;border-radius:99px;background:#07110d;overflow:hidden}.fill{height:100%;background:var(--g)}.fill.b{background:var(--b)}.fill.a{background:var(--a)}.notice{padding:12px;border:1px solid #5a4d27;background:#2e2918;border-radius:10px;color:#ead9a4;line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.5}@media(max-width:900px){.g6,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.match{grid-template-columns:1fr 54px 1fr}.date{grid-column:1/-1}.meta{display:none}.split{grid-template-columns:1fr}.vs{margin:auto}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
