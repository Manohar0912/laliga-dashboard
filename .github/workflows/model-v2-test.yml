name: Test prediction model v2

on:
  push:
    branches:
      - agent/prediction-model-v2

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train and backtest
        run: python scripts/train_model_ensemble.py
      - name: Validate model payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/model_predictions.json').read_text())
          v=p['validation']
          assert v['matches'] >= 2500, v
          assert len(p['predictions']) >= 300, len(p['predictions'])
          assert v['logLoss'] < v['baselineLogLoss'], v
          assert v['brier'] <= v['baselineBrier'], v
          assert v['accuracy'] >= v['baselineAccuracy'], v
          print(json.dumps(v, indent=2))
          PY
