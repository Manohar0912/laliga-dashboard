name: Test prediction model v2

on:
  push:
    branches:
      - agent/prediction-model-v2

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble dashboard template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Train and backtest
        run: python scripts/train_model_ensemble.py
      - name: Rebuild dashboard offline
        run: python scripts/update_laliga.py --offline
      - name: Embed trained model
        run: python scripts/inject_model.py
      - name: Validate datasets and model
        run: python scripts/validate.py
      - name: Validate generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/laliga-dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/laliga-dashboard.js
