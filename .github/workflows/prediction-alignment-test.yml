name: Prediction alignment test

on:
  push:
    branches:
      - agent/fix-prediction-alignment

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply fixes
        run: python scripts/fix_prediction_alignment_once.py
      - name: Assemble template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Normalize snapshot and rebuild
        run: python scripts/update_laliga.py --offline
      - name: Train outcome-aligned model
        run: python scripts/train_model_ensemble.py
      - name: Rebuild dashboard with trained model inputs
        run: python scripts/update_laliga.py --offline
      - name: Embed model
        run: python scripts/inject_model.py
      - name: Validate
        run: python scripts/validate.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dashboard.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Inspect Racing vs Villarreal prediction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path('data/model_predictions.json').read_text(encoding='utf-8'))
          p = model['predictions']['id:564629']
          probs = {'H': p['hp'], 'D': p['dp'], 'A': p['ap']}
          fav = max(probs, key=probs.get)
          assert p['pick']['outcome'] == fav
          print('1X2:', probs)
          print('Primary score pick:', p['pick'])
          print('Scenarios:', p['scenarios'])
          snap = json.loads(Path('data/current_snapshot.json').read_text(encoding='utf-8'))
          assert 'FC Barcelona' in snap['teams'] and 'Barça' not in snap['teams']
          assert 'Athletic Club' in snap['teams'] and 'Athletic' not in snap['teams']
          PY
      - name: Commit validated non-workflow changes
        run: |
          git config user.name "laliga-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update_laliga.py scripts/train_model_ensemble.py scripts/validate.py template_parts/part04.html dashboard_template.html data/current_snapshot.json data/model_predictions.json index.html
          git commit -m "Align score picks with final prediction probabilities" || true
          git push
