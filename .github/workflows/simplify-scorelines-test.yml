name: Simplify scorelines test

on:
  push:
    branches:
      - agent/simplify-top-scorelines

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply scoreline UI cleanup
        run: python scripts/simplify_scorelines_once.py
      - name: Assemble template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Rebuild dashboard offline
        run: python scripts/update_laliga.py --offline
      - name: Embed current trained model
        run: python scripts/inject_model.py
      - name: Validate dashboard
        run: python scripts/validate.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dashboard.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Confirm simplified scoreline UI
        run: |
          grep -q 'TOP 3 EXACT SCORES' index.html
          ! grep -q 'OUTCOME SCORE SCENARIOS' index.html
          ! grep -q 'MODEL SCORE PICK' index.html
      - name: Commit validated non-workflow changes
        run: |
          rm -f scripts/simplify_scorelines_once.py
          git config user.name "laliga-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add template_parts/part04.html dashboard_template.html scripts/validate.py index.html scripts/simplify_scorelines_once.py
          git commit -m "Simplify predictions to top three exact scores" || true
          git push
