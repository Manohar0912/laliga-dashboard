name: Season Stats tab test

on:
  push:
    branches:
      - agent/add-season-stats

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Season Stats patch
        run: python scripts/add_season_stats_tab_once.py
      - name: Fetch player leaderboards
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_season_stats.py
      - name: Assemble template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Rebuild dashboard
        run: python scripts/update_laliga.py --offline
      - name: Embed trained model
        run: python scripts/inject_model.py
      - name: Validate
        run: python scripts/validate.py
      - name: Validate JavaScript and leaderboard payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('data/season_stats.json').read_text())
          cur=stats['seasons']['2026/27']['players']
          assert cur and any(p['goals']>0 for p in cur), cur[:5]
          assert all('assists' in p for p in cur), cur[:5]
          html=Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          print('Season player rows:', {k:len(v.get('players',[])) for k,v in stats['seasons'].items()})
          PY
          node --check /tmp/dashboard.js
      - name: Commit validated feature files
        run: |
          rm -f scripts/add_season_stats_tab_once.py
          git config user.name "laliga-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add template_parts/part01.html template_parts/part04.html dashboard_template.html scripts/update_laliga.py scripts/update_season_stats.py scripts/validate.py data/season_stats.json index.html scripts/add_season_stats_tab_once.py
          git commit -m "Add Season Stats leaderboards" || true
          git push
