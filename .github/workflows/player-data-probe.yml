name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe football-data player endpoints
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ['FOOTBALL_DATA_TOKEN']
          headers = {
              'X-Auth-Token': token,
              'User-Agent': 'laliga-dashboard/1.0',
              'X-Unfold-Goals': 'true',
              'X-Unfold-Lineups': 'true',
              'X-Unfold-Subs': 'true',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.load(r)
                      print('OK', url, 'status', r.status)
                      return body
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')[:500]
                  print('HTTP_ERROR', url, e.code, body)
                  return None

          scorers = get('https://api.football-data.org/v4/competitions/PD/scorers?season=2025&limit=100')
          if scorers:
              items = scorers.get('scorers', [])
              print('SCORERS_COUNT', len(items))
              for item in items[:3]:
                  p = item.get('player') or {}
                  print('PLAYER', p.get('id'), p.get('name'), 'G', item.get('goals'), 'A', item.get('assists'))

          matches_payload = get('https://api.football-data.org/v4/competitions/PD/matches?season=2025&status=FINISHED')
          if matches_payload:
              matches = matches_payload.get('matches', [])
              with_goals = [m for m in matches if isinstance(m.get('goals'), list) and m.get('goals')]
              with_lineups = [m for m in matches if isinstance(m.get('lineups'), list) and m.get('lineups')]
              with_subs = [m for m in matches if isinstance(m.get('substitutions'), list) and m.get('substitutions')]
              print('COMP_MATCH_COUNT', len(matches))
              print('MATCHES_WITH_GOALS', len(with_goals))
              print('MATCHES_WITH_LINEUPS', len(with_lineups))
              print('MATCHES_WITH_SUBS', len(with_subs))
              sample = with_goals[0] if with_goals else (matches[0] if matches else None)
              if sample:
                  print('COMP_MATCH_SAMPLE', json.dumps({
                      'id': sample.get('id'),
                      'home': (sample.get('homeTeam') or {}).get('name'),
                      'away': (sample.get('awayTeam') or {}).get('name'),
                      'goals': sample.get('goals'),
                      'lineups': sample.get('lineups'),
                      'substitutions': sample.get('substitutions')
                  }, ensure_ascii=False)[:5000])
          PY
