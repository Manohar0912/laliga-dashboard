name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe football-data player endpoints
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ['FOOTBALL_DATA_TOKEN']
          headers = {'X-Auth-Token': token, 'User-Agent': 'laliga-dashboard/1.0'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.load(r)
                      print('OK', url, 'status', r.status)
                      return body
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')[:500]
                  print('HTTP_ERROR', url, e.code, body)
                  return None

          scorers = get('https://api.football-data.org/v4/competitions/PD/scorers?season=2025&limit=100')
          if scorers:
              items = scorers.get('scorers', [])
              print('SCORERS_COUNT', len(items))
              for item in items[:3]:
                  p = item.get('player') or {}
                  print('PLAYER', p.get('id'), p.get('name'), 'G', item.get('goals'), 'A', item.get('assists'))
              if items:
                  pid = (items[0].get('player') or {}).get('id')
                  if pid:
                      pm = get(f'https://api.football-data.org/v4/persons/{pid}/matches?competitions=PD&limit=5')
                      if pm:
                          print('PERSON_MATCH_KEYS', sorted(pm.keys()))
                          print('AGGREGATIONS', pm.get('aggregations'))
                          print('MATCH_COUNT', len(pm.get('matches', [])))
          PY
