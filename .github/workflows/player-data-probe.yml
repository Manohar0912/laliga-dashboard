name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe player data sources
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          token = os.environ['FOOTBALL_DATA_TOKEN']
          headers = {
              'X-Auth-Token': token,
              'User-Agent': 'laliga-dashboard/1.0',
              'X-Unfold-Goals': 'true',
              'X-Unfold-Lineups': 'true',
              'X-Unfold-Subs': 'true',
          }

          def fetch_text(url, request_headers=None):
              req = urllib.request.Request(url, headers=request_headers or {'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')

          def get_json(url, request_headers=None):
              try:
                  return json.loads(fetch_text(url, request_headers))
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR', url, e.code, e.read().decode('utf-8','replace')[:300])
                  return None

          scorers = get_json('https://api.football-data.org/v4/competitions/PD/scorers?season=2025&limit=100', headers)
          if scorers:
              items = scorers.get('scorers', [])
              print('SCORERS_COUNT', len(items))
              for item in items[:3]:
                  p = item.get('player') or {}
                  print('PLAYER', p.get('id'), p.get('name'), 'G', item.get('goals'), 'A', item.get('assists'))

          matches_payload = get_json('https://api.football-data.org/v4/competitions/PD/matches?season=2025&status=FINISHED', headers)
          if matches_payload:
              matches = matches_payload.get('matches', [])
              print('COMP_MATCH_COUNT', len(matches))
              print('MATCHES_WITH_GOALS', sum(bool(m.get('goals')) for m in matches))
              print('MATCHES_WITH_LINEUPS', sum(bool(m.get('lineups')) for m in matches))
              print('MATCHES_WITH_SUBS', sum(bool(m.get('substitutions')) for m in matches))

          try:
              page = fetch_text('https://understat.com/league/La_liga/2025')
              srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)', page, flags=re.I)
              print('UNDERSTAT_STATUS', len(page), 'SCRIPTS', len(srcs))
              for src in srcs:
                  if not src.startswith('js/'):
                      continue
                  url = 'https://understat.com/' + src
                  try:
                      js = fetch_text(url)
                  except Exception as e:
                      print('SCRIPT_ERROR', url, type(e).__name__, str(e)[:150])
                      continue
                  if 'league.min.js' in src or 'main.min.js' in src:
                      print('SCRIPT_OK', url, 'LEN', len(js))
                      for marker in ['ajax','fetch(','/get','leagueData','playersData','datesData','getLeague']:
                          pos = js.find(marker)
                          if pos >= 0:
                              print('MARKER', marker, js[max(0,pos-250):pos+550].replace('\n',' ')[:800])
          except Exception as e:
              print('UNDERSTAT_ERROR', type(e).__name__, str(e)[:300])
          PY
