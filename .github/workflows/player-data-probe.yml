name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe player data sources
        run: |
          python - <<'PY'
          import json, urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.load(r)
                  print('OK', url)
                  return data
              except Exception as e:
                  print('ERROR', url, type(e).__name__, str(e)[:300])
                  return None

          league = get_json('https://understat.com/league/getLeagueData/La_liga/2025')
          if league:
              print('LEAGUE_KEYS', sorted(league.keys()))
              players = league.get('players') or []
              print('PLAYER_COUNT', len(players))
              mb = next((p for p in players if 'Mbapp' in str(p)), None)
              print('MBAPPE_LEAGUE_ROW', json.dumps(mb, ensure_ascii=False)[:3500] if mb else 'NONE')

          player = get_json('https://understat.com/player/getPlayerData/3423')
          if player:
              print('PLAYER_KEYS', sorted(player.keys()))
              print('PLAYER_INFO', json.dumps(player.get('player'), ensure_ascii=False)[:1500])
              matches = player.get('matches') or []
              print('PLAYER_MATCH_COUNT', len(matches))
              for m in matches[:3]:
                  print('MATCH_SAMPLE', json.dumps(m, ensure_ascii=False)[:3000])
              barca = [m for m in matches if 'Barcelona' in json.dumps(m, ensure_ascii=False)]
              print('BARCA_MATCH_COUNT', len(barca))
              for m in barca[:5]:
                  print('BARCA_MATCH', json.dumps(m, ensure_ascii=False)[:3000])
          PY
