name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe player data sources
        run: |
          python - <<'PY'
          import gzip, json, urllib.request

          def get_json(url, referer):
              headers = {
                  'User-Agent':'Mozilla/5.0',
                  'Accept':'application/json, text/javascript, */*; q=0.01',
                  'X-Requested-With':'XMLHttpRequest',
                  'Referer':referer,
              }
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  enc=r.headers.get('Content-Encoding','')
              if raw[:2]==b'\x1f\x8b' or 'gzip' in enc.lower(): raw=gzip.decompress(raw)
              return json.loads(raw.decode('utf-8'))

          league=get_json('https://understat.com/getLeagueData/La_liga/2025','https://understat.com/league/La_liga/2025')
          print('LEAGUE_KEYS',sorted(league.keys()))
          players=league.get('players') or []
          print('PLAYER_COUNT',len(players))
          mb=next((p for p in players if 'Mbapp' in str(p)),None)
          print('MBAPPE_LEAGUE_ROW',json.dumps(mb,ensure_ascii=False)[:5000])

          player=get_json('https://understat.com/getPlayerData/3423','https://understat.com/player/3423')
          print('PLAYER_KEYS',sorted(player.keys()))
          print('PLAYER_INFO',json.dumps(player.get('player'),ensure_ascii=False)[:2500])
          matches=player.get('matches') or []
          print('PLAYER_MATCH_COUNT',len(matches))
          for m in matches[:3]: print('MATCH_SAMPLE',json.dumps(m,ensure_ascii=False)[:4500])
          barca=[m for m in matches if 'Barcelona' in json.dumps(m,ensure_ascii=False)]
          print('BARCA_MATCH_COUNT',len(barca))
          for m in barca[:6]: print('BARCA_MATCH',json.dumps(m,ensure_ascii=False)[:4500])
          PY
