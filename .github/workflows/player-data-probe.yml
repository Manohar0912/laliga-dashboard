name: Probe player data access

on:
  push:
    branches:
      - agent/player-data-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe player data sources
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          def fetch_text(url, request_headers=None):
              req = urllib.request.Request(url, headers=request_headers or {'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')

          def get_json(url, request_headers=None):
              try:
                  return json.loads(fetch_text(url, request_headers))
              except Exception as e:
                  print('JSON_ERROR', url, type(e).__name__, str(e)[:250])
                  return None

          token = os.environ['FOOTBALL_DATA_TOKEN']
          fd_headers = {'X-Auth-Token': token, 'User-Agent': 'laliga-dashboard/1.0'}
          scorers = get_json('https://api.football-data.org/v4/competitions/PD/scorers?season=2025&limit=100', fd_headers)
          if scorers:
              items = scorers.get('scorers', [])
              print('FOOTBALL_DATA_SCORERS', len(items))
              for item in items[:3]:
                  p = item.get('player') or {}
                  print('FD_PLAYER', p.get('id'), p.get('name'), item.get('goals'), item.get('assists'))

          league = get_json('https://understat.com/getLeagueData/La_liga/2025')
          print('UNDERSTAT_LEAGUE_TYPE', type(league).__name__)
          if league:
              print('UNDERSTAT_LEAGUE_KEYS', sorted(league.keys()))
              players = league.get('players') or []
              print('UNDERSTAT_PLAYERS', len(players))
              for p in players[:3]:
                  print('US_PLAYER_SAMPLE', json.dumps(p, ensure_ascii=False)[:1200])
              mb = next((p for p in players if 'Mbapp' in str(p.get('player_name') or p.get('player') or p.get('name') or '')), None)
              print('MBAPPE_LEAGUE_ROW', json.dumps(mb, ensure_ascii=False)[:2000] if mb else 'NONE')

          search = get_json('https://understat.com/main/getPlayersName/Kylian')
          print('UNDERSTAT_SEARCH', json.dumps(search, ensure_ascii=False)[:2500] if search else 'NONE')
          mb_id = None
          if search:
              pool = ((search.get('response') or {}).get('players') or []) if isinstance(search, dict) else []
              for p in pool:
                  if 'Mbapp' in str(p.get('player','')):
                      mb_id = p.get('id'); break
          if mb_id:
              page = fetch_text(f'https://understat.com/player/{mb_id}')
              srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)', page, flags=re.I)
              print('MBAPPE_UNDERSTAT_ID', mb_id, 'PLAYER_SCRIPTS', [s for s in srcs if 'player' in s.lower()])
              for src in srcs:
                  if 'player' not in src.lower() or not src.startswith('js/'):
                      continue
                  js = fetch_text('https://understat.com/' + src)
                  print('PLAYER_SCRIPT', src, 'LEN', len(js))
                  for marker in ['ajax','getPlayer','playerData','datesData','matchesData','getPlayerData']:
                      pos = js.find(marker)
                      if pos >= 0:
                          print('PLAYER_MARKER', marker, js[max(0,pos-280):pos+620].replace('\n',' ')[:900])
          PY
