name: Assist event probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect football-data match events
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url='https://api.football-data.org/v4/competitions/PD/matches?season=2026'
          req=urllib.request.Request(url,headers={'X-Auth-Token':os.environ['FOOTBALL_DATA_TOKEN'],'User-Agent':'laliga-dashboard/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          finished=[m for m in payload.get('matches',[]) if m.get('status')=='FINISHED']
          print('finished',len(finished))
          for m in finished[-6:]:
              print('MATCH',m.get('id'),m.get('homeTeam',{}).get('name'),m.get('awayTeam',{}).get('name'))
              print('keys',sorted(m.keys()))
              print('goals',json.dumps(m.get('goals'),ensure_ascii=False))
          PY
