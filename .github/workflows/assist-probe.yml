name: Assist source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect football-data match events and assist-ranked source
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          # Confirm football-data match payload cannot be used to self-calculate assists.
          url='https://api.football-data.org/v4/competitions/PD/matches?season=2026'
          req=urllib.request.Request(url,headers={'X-Auth-Token':os.environ['FOOTBALL_DATA_TOKEN'],'User-Agent':'laliga-dashboard/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          finished=[m for m in payload.get('matches',[]) if m.get('status')=='FINISHED']
          print('football-data finished',len(finished),'sample keys',sorted(finished[-1].keys()) if finished else [])
          print('football-data goals field',finished[-1].get('goals') if finished else None)

          # Test the dedicated assists ranking page used as the replacement source.
          as_url='https://as.com/resultados/futbol/primera/2026_2027/ranking/jugadores/asistencias-de-gol/'
          req=urllib.request.Request(as_url,headers={'User-Agent':'Mozilla/5.0 (compatible; laliga-dashboard/1.0)'})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8','replace')
          print('AS status bytes',len(html))
          for needle in ('Javi Hernández','Mariano','Asistencias de gol'):
              print(needle, needle in html)
          for needle in ('Javi Hernández','Mariano'):
              i=html.find(needle)
              if i>=0: print('SNIP',re.sub(r'\s+',' ',html[max(0,i-300):i+500]))
          PY
