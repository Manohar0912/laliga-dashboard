name: Assist leaderboard fix test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-season-assists
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch Season Stats UI and validation
        run: python scripts/patch_assist_leaderboard_once.py
      - name: Refresh separated goal and assist leaderboards
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_season_stats.py
      - name: Assemble template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Rebuild dashboard
        run: python scripts/update_laliga.py --offline
      - name: Embed trained model
        run: python scripts/inject_model.py
      - name: Validate build and current assist leaders
        run: |
          python scripts/validate.py
          python - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('data/season_stats.json').read_text(encoding='utf-8'))['seasons']['2026/27']
          assists=stats['assists']
          top=max(x['assists'] for x in assists)
          leaders=[(x['name'],x['team'],x['assists']) for x in assists if x['assists']==top]
          print('CURRENT ASSIST LEADERS',leaders)
          assert any(x[0]=='Javi Hernández' and x[2]>=2 for x in leaders), leaders
          html=Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Commit validated fix to branch
        run: |
          rm -f scripts/patch_assist_leaderboard_once.py
          git config user.name "laliga-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update_season_stats.py scripts/validate.py template_parts/part04.html data/season_stats.json dashboard_template.html index.html scripts/patch_assist_leaderboard_once.py
          git commit -m "Fix incomplete Season Stats assists leaderboard" || true
          git push origin HEAD:agent/fix-season-assists
