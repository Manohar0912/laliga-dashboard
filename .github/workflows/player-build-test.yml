name: Test player analytics build

on:
  push:
    branches:
      - agent/player-history-vs-team

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Assemble template
        run: cat template_parts/part*.html > dashboard_template.html
      - name: Ensure history exists
        run: python scripts/bootstrap_history.py
      - name: Build player data
        run: python scripts/update_players.py
      - name: Build dashboard offline
        run: python scripts/update_laliga.py --offline
      - name: Validate datasets
        run: python scripts/validate.py
      - name: Validate generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/laliga-dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/laliga-dashboard.js
